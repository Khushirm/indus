[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indus"
version = "0.1.0"
description = "LLM-agent framework for falsifiable hypothesis testing on the Indus script"
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
